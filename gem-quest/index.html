<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Gem Quest</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="../index.html">&larr; Game select</a>
  <canvas id="game" width="768" height="576"></canvas>
  <p class="help">Move: arrows / A D &nbsp;·&nbsp; Jump: Space / Up / X &nbsp;·&nbsp; Punch: Z / J &nbsp;·&nbsp; Pause: P &nbsp;·&nbsp; Sound: M &nbsp;·&nbsp; Start: Enter</p>
  <script src="js/levels.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/audio.js"></script>
  <script src="../shared/touch-controls.js"></script>
  <script src="js/game.js"></script>
  <script>
    TouchControls.setup({
      stick: { left: 'ArrowLeft', right: 'ArrowRight' },
      buttons: [
        { label: 'JUMP', key: ' ' },
        { label: () => (LEVELS[state.levelIndex].bike ? 'MAGIC' : 'PUNCH'), key: 'z' },
      ],
      top: [{ label: 'II', key: 'p', tap: true }, { label: '♪', key: 'm', tap: true }],
      menu: () => state.mode !== 'playing' || state.paused,
      menuKey: () => (state.paused ? 'p' : 'Enter'),
      menuButtons: [
        { label: '◀', key: 'ArrowLeft', tap: true, show: () => state.mode === 'title' },
        { label: '▶', key: 'ArrowRight', tap: true, show: () => state.mode === 'title' },
      ],
      menuHint: false,
    });
  </script>
</body>
</html>
