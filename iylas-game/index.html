<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff7eb6">
<title>Iyla's Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd3ec;font-family:'Fredoka',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#gl{position:fixed;inset:0;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.scr.on{display:flex}
.scr .pe,.scr button{pointer-events:auto}
.dim{background:radial-gradient(ellipse at center,rgba(90,20,70,.25),rgba(60,10,50,.6))}
.btn{font:700 clamp(18px,4.6vmin,30px) 'Fredoka',system-ui,sans-serif;color:#fff;background:linear-gradient(#ff9fd0,#ff4f9a);border:4px solid #fff;border-radius:999px;padding:.4em 1.3em;box-shadow:0 6px 0 #c2276b,0 10px 18px rgba(0,0,0,.25);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.2);margin:.3em}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c2276b}
.btn.green{background:linear-gradient(#8ee88a,#2fae4a);box-shadow:0 6px 0 #1d7a31,0 10px 18px rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(#8fd6ff,#3a8fe0);box-shadow:0 6px 0 #1f5c9e,0 10px 18px rgba(0,0,0,.25)}
.btn.small{font-size:clamp(14px,3.4vmin,20px);padding:.3em .9em;border-width:3px}
.logo{font-weight:700;font-size:clamp(54px,15vmin,130px);line-height:.95;color:#ffe14d;-webkit-text-stroke:3px #a02a6a;paint-order:stroke fill;text-shadow:0 6px 0 #a02a6a,0 12px 22px rgba(0,0,0,.3);transform:rotate(-4deg);animation:bob 2.4s ease-in-out infinite}
.logo small{display:block;font-size:.34em;color:#fff;-webkit-text-stroke:2px #a02a6a;margin-top:.2em}
@keyframes bob{50%{transform:rotate(-2deg) translateY(-8px)}}
.tap{margin-top:6vh;font-size:clamp(22px,5.5vmin,36px);font-weight:700;color:#fff;-webkit-text-stroke:1.5px #a02a6a;paint-order:stroke fill;text-shadow:0 3px 0 #a02a6a;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
h2.t{margin:0;font-size:clamp(28px,7.5vmin,60px);color:#fff;-webkit-text-stroke:2px #a02a6a;paint-order:stroke fill;text-shadow:0 4px 0 #a02a6a,0 8px 16px rgba(0,0,0,.25)}
h2.t small{font-size:.55em;color:#ffe14d}
#select{justify-content:space-between}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
.tab{font:700 clamp(13px,3.4vmin,19px) 'Fredoka',system-ui,sans-serif;color:#a02a6a;background:rgba(255,255,255,.7);border:3px solid #fff;border-radius:999px;padding:.25em .8em;cursor:pointer}
.tab.on{background:#ff4f9a;color:#fff}
.cards{display:flex;gap:2vmin;justify-content:safe center;overflow-x:auto;max-width:98vw;padding:10px 8px 12px;margin-bottom:.5vh;scrollbar-width:none;touch-action:pan-x}
.cards::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:clamp(86px,23vmin,150px);background:rgba(255,255,255,.88);color:#6a2350;border-radius:20px;padding:8px 6px;border:4px solid #fff;cursor:pointer;box-shadow:0 6px 0 rgba(160,42,106,.5);transition:transform .15s}
.card.on{border-color:#ff4f9a;background:#fff;transform:translateY(-6px) scale(1.05)}
.card.locked{background:rgba(220,220,230,.85);color:#7a6a80}
.card.locked .em{filter:grayscale(1) brightness(.7)}
.card .em{font-size:clamp(28px,8.5vmin,54px);line-height:1.1}
.card b{display:block;font-size:clamp(15px,3.8vmin,23px)}
.card i{display:block;font-style:normal;font-size:clamp(10px,2.6vmin,14px);line-height:1.2;min-height:2.4em}
.card.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* map */
#mapUI .tl{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));display:flex;gap:6px}
#mapUI .tr{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:6px;align-items:center}
.hintbar{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.88);color:#6a2350;font-weight:700;padding:.45em 1em;border-radius:999px;font-size:clamp(13px,3.4vmin,20px);white-space:nowrap;box-shadow:0 4px 0 rgba(160,42,106,.4);transition:opacity .6s}
#pop{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);transition:transform .35s cubic-bezier(.3,1.5,.5,1);background:rgba(255,255,255,.95);color:#6a2350;border-radius:24px;padding:12px 18px;border:4px solid #ffb3d6;box-shadow:0 10px 30px rgba(0,0,0,.3);min-width:min(86vw,360px);max-width:94vw;pointer-events:auto}
#pop.on{transform:translateX(-50%) translateY(0)}
#pop h3{margin:0;font-size:clamp(22px,6vmin,34px)}
#pop p{margin:.2em 0 .3em;font-size:clamp(13px,3.4vmin,18px)}
#pop .stars{font-size:clamp(20px,5vmin,28px);color:#ffb400;letter-spacing:.1em}
#popRide{font-weight:700}
#lockBtn{font-size:clamp(28px,7vmin,44px);cursor:pointer;display:inline-block}
/* level hud */
#lvlUI .row{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;align-items:center;gap:8px}
.pill{background:rgba(255,255,255,.85);color:#6a2350;font-weight:700;border-radius:999px;padding:.15em .6em;font-size:clamp(17px,4.4vmin,30px);box-shadow:0 3px 0 rgba(160,42,106,.4);white-space:nowrap}
#hearts{letter-spacing:.02em}
#miloPill{transition:opacity .4s,transform .4s}
#miloPill.away{opacity:.35;transform:scale(.85)}
#prog{flex:1;min-width:40px;height:clamp(14px,3vmin,20px);background:rgba(255,255,255,.6);border-radius:999px;position:relative;border:3px solid #fff;box-shadow:0 3px 0 rgba(160,42,106,.4)}
#prog .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#ffd84a,#ff7eb6)}
#prog .who{position:absolute;top:50%;transform:translate(-50%,-55%);font-size:clamp(20px,5vmin,30px)}
#prog .end{position:absolute;right:-6px;top:50%;transform:translateY(-55%);font-size:clamp(18px,4.4vmin,26px)}
#prog .cp{position:absolute;top:-3px;bottom:-3px;width:4px;background:#fff;border-radius:2px}
#pauseBtn{pointer-events:auto;flex:0 0 auto;width:clamp(40px,9vmin,52px);height:clamp(40px,9vmin,52px);border-radius:50%;border:3px solid #fff;background:#ff6fae;color:#fff;font:700 clamp(16px,4vmin,22px) 'Fredoka';box-shadow:0 3px 0 #c2276b;cursor:pointer;padding:0}
#bossBar{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + clamp(50px,11vmin,66px));transform:translateX(-50%);display:none;align-items:center;gap:.4em;font-weight:700;font-size:clamp(16px,4vmin,26px);color:#fff;-webkit-text-stroke:1.5px #6a0a20;paint-order:stroke fill;text-shadow:0 3px 0 #6a0a20}
#bossBar.on{display:flex}
#bossBar .bar{width:min(46vw,300px);height:clamp(14px,3vmin,20px);background:rgba(0,0,0,.35);border:3px solid #fff;border-radius:999px;overflow:hidden}
#bossBar i{display:block;height:100%;width:100%;background:linear-gradient(#ff9a7a,#e8203a);transition:width .3s}
#zones{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 4vw;transition:opacity 1s}
#zones div{background:rgba(255,255,255,.7);color:#6a2350;font-weight:700;border-radius:16px;padding:.35em .8em;font-size:clamp(14px,3.6vmin,22px)}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-weight:700;font-size:clamp(40px,12vmin,100px);color:#ffe14d;-webkit-text-stroke:3px #a02a6a;paint-order:stroke fill;text-shadow:0 6px 0 #a02a6a;pointer-events:none;opacity:0;transform:scale(.4) rotate(-6deg);transition:opacity .2s,transform .35s cubic-bezier(.3,1.7,.5,1);padding:0 8px}
#banner.on{opacity:1;transform:scale(1) rotate(-4deg)}
#hint{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + clamp(90px,20vmin,120px));transform:translateX(-50%) scale(.6);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.3,1.7,.5,1);background:#fff;color:#a02a6a;font-weight:700;border-radius:18px;padding:.35em .9em;font-size:clamp(15px,4.2vmin,28px);box-shadow:0 5px 0 rgba(160,42,106,.45);pointer-events:none;white-space:nowrap}
#hint.on{opacity:1;transform:translateX(-50%) scale(1)}
.big{font-size:clamp(40px,11vmin,90px);font-weight:700;color:#ffe14d;-webkit-text-stroke:3px #a02a6a;paint-order:stroke fill;text-shadow:0 6px 0 #a02a6a;line-height:1}
.res{font-size:clamp(18px,4.8vmin,32px);font-weight:700;margin:.3em 0 .5em;text-shadow:0 3px 0 rgba(160,42,106,.8)}
.res .stars{display:block;font-size:clamp(38px,10vmin,70px);color:#ffcf1a;-webkit-text-stroke:2px #a0601a;letter-spacing:.08em}
.res .new{display:block;font-size:.8em;color:#fff6b0;margin-top:.15em}
#muteBtn{min-width:2.6em}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#a02a6a;background:#ffd3ec}
@media (max-height:480px){.tap{margin-top:3vh}.card i{display:none}.card{padding:4px}}
</style>
</head>
<body>
<div id="loading">Loading Iyla's Game…</div>

<div class="scr" id="title">
  <div class="logo">Iyla's Game<small>Wild rides across Africa!</small></div>
  <div class="tap">Tap to play!</div>
</div>

<div class="scr" id="select">
  <h2 class="t" id="selTitle">Get ready!</h2>
  <div>
    <div class="tabs pe" id="tabs">
      <button class="tab" data-t="ride">🦒 Ride</button>
      <button class="tab" data-t="sea">🐬 Sea ride</button>
      <button class="tab" data-t="outfit">👗 Outfit</button>
      <button class="tab" data-t="friend">🐶 Friend</button>
    </div>
    <div class="cards pe" id="cards"></div>
    <button class="btn green" id="goBtn">Let's ride! ▶</button>
  </div>
</div>

<div class="scr" id="mapUI">
  <div class="tl"><button class="btn small pe" id="rideBtn">🦒 Change</button></div>
  <div class="tr"><div class="pill" id="starPill">★ 0</div><button class="btn small blue pe" id="muteBtn">🔊</button></div>
  <div class="hintbar" id="mapHint">Tap where you want to go · ride into a gate to play!</div>
  <div id="pop">
    <h3 id="popTitle"></h3>
    <p id="popDesc"></p>
    <p id="popRide"></p>
    <div class="stars" id="popStars"></div>
    <div id="popLock" style="display:none"><span id="lockBtn">🔒</span><p id="lockMsg"></p></div>
    <button class="btn green" id="popPlay">Play! ▶</button>
  </div>
</div>

<div class="scr" id="lvlUI">
  <div class="row">
    <div class="pill" id="hearts"></div>
    <div id="prog"><div class="fill"></div><div class="end">🏁</div><div class="who"></div></div>
    <div class="pill" id="miloPill">🐶</div>
    <div class="pill" id="fruitPill"></div>
    <button id="pauseBtn">❚❚</button>
  </div>
  <div id="bossBar"><span id="bossName"></span><div class="bar"><i id="bossFill"></i></div></div>
  <div id="zones"><div>◀ tap</div><div>tap middle to JUMP</div><div>tap ▶</div></div>
</div>

<div class="scr dim" id="pause">
  <div class="big">Paused</div>
  <div style="margin-top:3vh">
    <button class="btn green" id="resumeBtn">Keep going ▶</button><br>
    <button class="btn blue small" id="restartBtn">Start again</button>
    <button class="btn small" id="quitBtn">Back to the map</button>
  </div>
</div>

<div class="scr dim" id="result">
  <div class="big" id="resTitle">Hooray, Iyla!</div>
  <div class="res" id="resBody"></div>
  <div>
    <button class="btn green" id="resMap">To the map ▶</button>
    <button class="btn blue" id="resAgain">Play again</button>
  </div>
</div>

<div class="scr dim" id="fail">
  <div class="big">Oh no!</div>
  <div class="res">Out of hearts. Try again from the last flag?</div>
  <div>
    <button class="btn green" id="failRetry">Try again ▶</button>
    <button class="btn small" id="failMap">Back to the map</button>
  </div>
</div>

<div id="banner"></div>
<div id="hint"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   IYLA'S GAME
   Iyla rides an animal across a little African island and through
   auto-running levels: Serengeti, Desert (rhino boss), Volcano,
   Under the Sea (shark boss) and Candyland. Milo the sausage dog can
   run along as a spare life. Everything (models, textures, music) is
   made in code in this file.
   ===================================================================== */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- save ---------------- */
const SAVE_KEY = 'islasGame1';
const save = Object.assign({ done: {}, open: {}, best: {}, animal: 'giraffe', sea: 'dolphin', outfit: 'pink', friend: '', muted: false },
  (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) { return {}; } })());
save.done = save.done || {}; save.open = save.open || {};
if (save.candy) save.done.serengeti = true;          // older saves
for (const k in save.best) save.done[k] = true;
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }
function totalStars() { let n = 0; for (const k in save.best) n += save.best[k].stars || 0; return n; }

/* ---------------- rides ---------------- */
const ANIMALS = {
  giraffe: { name: 'Giraffe', em: '🦒', desc: 'Super high jumps!', jump: 13, hearts: 3, speed: 1, steer: 11, magnet: 1.5, camH: 7.5 },
  hippo: { name: 'Hippo', em: '🦛', desc: 'Extra tough: 5 hearts!', jump: 11.2, hearts: 5, speed: 0.92, steer: 10, magnet: 1.5, camH: 5.3 },
  lion: { name: 'Lion', em: '🦁', desc: 'Fast, and grabs treats from far away!', jump: 11.6, hearts: 3, speed: 1.1, steer: 15, magnet: 2.5, camH: 5.3 },
  elephant: { name: 'Elephant', em: '🐘', desc: 'Smashes right through rocks!', jump: 10.8, hearts: 4, speed: 0.92, steer: 10, magnet: 1.7, camH: 7.4, smash: true },
  zebra: { name: 'Zebra', em: '🦓', desc: 'Zoom! The speediest ride', jump: 11.8, hearts: 3, speed: 1.16, steer: 15, magnet: 1.5, camH: 5.6 },
  tiger: { name: 'Tiger', em: '🐯', desc: 'Tap again in the air to double jump!', jump: 11, hearts: 3, speed: 1.05, steer: 13, magnet: 1.6, camH: 5.4, double: true },
  flamingo: { name: 'Flamingo', em: '🦩', desc: 'Flaps and floats down slowly', jump: 11.5, hearts: 3, speed: 1, steer: 12, magnet: 1.7, camH: 7.3, glide: true },
  dolphin: { sea: true, name: 'Dolphin', em: '🐬', desc: 'Fast, with double jumps!', jump: 9.6, hearts: 3, speed: 1.08, steer: 14, magnet: 1.8, camH: 5.2, double: true },
  shark: { sea: true, name: 'Shark', em: '🦈', desc: 'Chomps right through coral!', jump: 9.4, hearts: 4, speed: 1, steer: 12, magnet: 1.7, camH: 5.2, smash: true },
  whale: { sea: true, name: 'Whale', em: '🐋', desc: 'Big and strong: 5 hearts!', jump: 9.2, hearts: 5, speed: 0.92, steer: 10, magnet: 2.3, camH: 6.4 },
};
const LAND = Object.keys(ANIMALS).filter(k => !ANIMALS[k].sea), SEA = Object.keys(ANIMALS).filter(k => ANIMALS[k].sea);
if (!ANIMALS[save.animal] || ANIMALS[save.animal].sea) save.animal = 'giraffe';
if (!ANIMALS[save.sea] || !ANIMALS[save.sea].sea) save.sea = 'dolphin';

const OUTFITS = [
  { k: 'pink', name: 'Pink Dress', em: '👗', need: 0, top: 0xff5fa8, skirt: 0xff9fd0, shoes: 0xff4f9a },
  { k: 'safari', name: 'Explorer', em: '🤠', need: 3, top: 0xd8b27a, skirt: 0x6b8e3a, shoes: 0x7a4a24, hat: 'safari' },
  { k: 'princess', name: 'Princess', em: '👑', need: 6, top: 0xa66bff, skirt: 0xd9b3ff, shoes: 0xffd84a, hat: 'crown' },
  { k: 'hero', name: 'Super Iyla', em: '🦸', need: 9, top: 0x2f6fe0, skirt: 0xe83a3a, shoes: 0xe83a3a, cape: 0xe83a3a },
  { k: 'mermaid', name: 'Mermaid', em: '🧜', need: 12, top: 0x7a5cff, skirt: 0x2fd0b0, shoes: 0x2fd0b0, hat: 'shell' },
  { k: 'rainbow', name: 'Rainbow Star', em: '🌈', need: 15, top: 0xffd84a, skirt: 'rainbow', shoes: 0xff5fa8, hat: 'star' },
];
const outfitOf = k => OUTFITS.find(o => o.k === k) || OUTFITS[0];
if (outfitOf(save.outfit).need > totalStars()) save.outfit = 'pink';
const MILO_NEED = 2;
const miloOpen = () => totalStars() >= MILO_NEED;
const LAND_GRAV = 30, LANE = 2.4;

const THEMES = {
  serengeti: {
    key: 'serengeti', name: 'Serengeti Stampede', em: '🌍', len: 1250, seed: 2024,
    desc: 'Race across the savanna! Jump the lava streams and dodge the rocks.',
    sky: ['#4fb0ee', '#a9dcf5', '#ffe2a8'], fog: 0xf5ddb0, ground: 'savanna', path: 'dirt', river: 'lava',
    hemi: [0xe6f4ff, 0xa9864b, 0.82], fruitEm: '🥭', fruitName: 'mangoes', music: 'serengeti',
    hints: { low: 'Jump the rocks, or move past them!', river: 'Jump over the lava!', bar: 'Jump over the log!', tall: 'Too tall! Move to dodge it!' },
  },
  desert: {
    key: 'desert', name: 'Desert Dash', em: '🏜️', len: 1150, seed: 909, req: 'serengeti', boss: 'rhino',
    desc: 'Gallop past the pyramids, jump the quicksand… and watch out for the Rhino!',
    sky: ['#4aa8ea', '#b5def2', '#ffd79a'], fog: 0xf3d8a8, ground: 'sand', path: 'sandPath', river: 'quicksand',
    hemi: [0xfff4e0, 0xc89a5a, 0.85], fruitEm: '🪙', fruitName: 'gold coins', music: 'desert',
    hints: { low: 'Jump the rocks!', river: 'Jump the quicksand!', bar: 'Jump the old stone pillar!', tall: 'Prickly cactus! Move to dodge it!' },
  },
  volcano: {
    key: 'volcano', name: 'Volcano Run', em: '🌋', len: 1200, seed: 4242, req: 'desert', meteors: true,
    desc: 'The volcano is erupting! Jump the lava and dodge the fireballs.',
    sky: ['#1e0a14', '#6a1a18', '#ff7a3a'], fog: 0x5e2220, ground: 'ash', path: 'basalt', river: 'lava',
    hemi: [0xffb08a, 0x3a1a10, 0.85], fruitEm: '💎', fruitName: 'gems', music: 'volcano',
    hints: { low: 'Hot rocks! Jump them!', river: 'Jump over the lava!', bar: 'Jump the lava rock!', tall: 'Spiky rocks! Move to dodge!', meteor: 'Fireball! Get off the red circle!' },
  },
  ocean: {
    key: 'ocean', name: 'Under the Sea', em: '🐠', len: 1150, seed: 5151, req: 'serengeti', boss: 'shark', sea: true, grav: 18,
    desc: 'Swim through the coral reef with your sea friend… a giant shark lives here!',
    sky: ['#86e3ff', '#2a92c8', '#0d5486'], fog: 0x1f74a4, fogNear: 30, fogFar: 115, ground: 'seabed', path: 'seaPath', river: 'urchins',
    hemi: [0x9fdcff, 0x1f5a7a, 0.75], fruitEm: '⭐', fruitName: 'starfish', music: 'ocean',
    hints: { low: 'Swim over the coral!', river: 'Swim over the spiky urchins!', bar: 'Swim over the old mast!', tall: 'Big rock! Move to dodge it!' },
  },
  candy: {
    key: 'candy', name: 'Candyland', em: '🍭', len: 1300, seed: 7331, req: 'serengeti',

let mode = 'loading';
const keys = {};
function updateWorld(dt) {
  W.t += dt; const t = W.t;
  const r = W.rider;
  let moving = false;
  if (mode === 'map') {
    let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    let dz = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    if (dx || dz) W.target = null;
    else if (W.target) { dx = W.target.x - W.pos.x; dz = W.target.z - W.pos.z; if (Math.hypot(dx, dz) < 0.4) { W.target = null; dx = dz = 0; W.marker.visible = false; } }

    }
    for (const c of W.cols) { const ex = W.pos.x - c.x, ez = W.pos.z - c.z, d = Math.hypot(ex, ez), rr = c.r + 0.9; if (d < rr && d > 0.001) { W.pos.x = c.x + ex / d * rr; W.pos.z = c.z + ez / d * rr; } }
    const R = Math.hypot(W.pos.x, W.pos.z); if (R > 45) { W.pos.x *= 45 / R; W.pos.z *= 45 / R; }
    W.pos.y = heightAt(W.pos.x, W.pos.z);
    r.root.position.copy(W.pos); r.root.rotation.y = W.face;
    let near = null;
    for (const k in W.gates) if (Math.hypot(W.pos.x - W.gates[k].trig.x, W.pos.z - W.gates[k].trig.z) < 3) near = k;
    if (near !== W.near) { W.near = near; showGatePop(near); }
    if (moving && Math.random() < dt * 12) W.fx.spawn(W.pos.x + rand(-0.5, 0.5), W.pos.y + 0.2, W.pos.z + rand(-0.5, 0.5), W.pos.y > 1 ? 0xffc6e6 : 0xe8d2a0, { vy: rand(0.5, 1.5), g: 0, size: 0.6, grow: 2, op: 0.6, life: 0.5 });
    const back = portrait ? 19 : 15, up = portrait ? 21 : 15;
    camera.position.lerp(new THREE.Vector3(W.pos.x, W.pos.y + up, W.pos.z + back), 1 - Math.exp(-dt * 5));
    camera.lookAt(W.pos.x, W.pos.y + 1, W.pos.z - 3);
  } else if (mode === 'title') {
    const a = t * 0.12; camera.position.set(Math.sin(a) * 44, 21, -4 + Math.cos(a) * 44); camera.lookAt(0, 0, -6);
    r.root.position.copy(W.pos); r.root.rotation.y = W.face;
  } else if (mode === 'select') {
    r.root.position.copy(W.pos); r.root.rotation.y += dt * 0.9;
    const h = ANIMALS[r.kind].camH;
    camera.position.set(W.pos.x, W.pos.y + h * 0.6, W.pos.z + (portrait ? 13 : 8));
    camera.lookAt(W.pos.x, W.pos.y + h * (portrait ? 0.3 : 0.42), W.pos.z);
  }

    const bx = Math.sin(f), bz = Math.cos(f);
    const tx = W.pos.x + bx * 1.6 + bz * 1.8, tz = W.pos.z + bz * 1.6 - bx * 1.8;
    const ex = tx - m.g.position.x, ez = tz - m.g.position.z, d = Math.hypot(ex, ez);
    let run = 0;
    if (d > 0.3) { const sp = Math.min(d * 4, 14); m.g.position.x += ex / d * sp * dt; m.g.position.z += ez / d * sp * dt; m.g.rotation.y = Math.atan2(-ex, -ez); run = Math.min(1, d); }
    else if (mode === 'select') m.g.rotation.y = f;

  for (const k in W.gates) { const gt = W.gates[k]; gt.ring.material.opacity = 0.5 + Math.sin(t * 4) * 0.3; gt.ring.scale.setScalar(1 + Math.sin(t * 4) * 0.06); gt.lock.rotation.y = Math.sin(t * 2) * 0.3; }
  // a dolphin leaping off the pier
  const dp = (t * 0.5) % TAU, D = W.dolphin; const ca = 0.78 + Math.sin(t * 0.2) * 0.25;

}

/* =====================================================================
   LEVELS: auto-running chase down a 3-lane track
   ===================================================================== */
let LV = null;
const BOSS_RUN = 520;
function genCourse(th) {
  const r = mulberry32(th.seed); const len = th.len; const ri = n => Math.floor(r() * n);
  const obs = [], fr = [];
  const cps = [Math.round(-len / 3), Math.round(-2 * len / 3)];
  const line = (lane, z0, z1, n) => { for (let i = 0; i < n; i++) fr.push({ x: lane * LANE, y: 1.25, z: z0 + (z1 - z0) * i / (n - 1) }); };
  const arc = (lane, zc) => { for (let i = 0; i < 5; i++) { const t = i / 4; fr.push({ x: lane * LANE, y: 1.25 + 1.9 * Math.sin(Math.PI * t), z: zc + 5 - 10 * t }); } };
  line(0, -14, -38, 5);
  let z = -60;
  while (z > -len + 45) {
    const p = -z / len;
    if (cps.some(c => Math.abs(z - c) < 16)) { z -= 20; continue; }
    let pool = p < 0.14 ? ['low1', 'river', 'low1'] : p < 0.4 ? ['low1', 'river', 'bar', 'tall1', 'low2', 'river'] : ['low1', 'river', 'bar', 'tall1', 'low2', 'tall2', 'tall2', 'river', 'bar'];
    if (th.meteors && p > 0.08) pool = pool.concat(['meteor', 'meteor', 'river']);
    const kind = pool[ri(pool.length)];
    const o = { kind, z };
    if (kind === 'low1' || kind === 'tall1' || kind === 'meteor') o.lanes = [ri(3) - 1];
    else if (kind === 'low2' || kind === 'tall2') { o.free = ri(3) - 1; o.lanes = [-1, 0, 1].filter(l => l !== o.free); }
    obs.push(o);
    const gap = 37 - 11 * p + r() * 6;
    if (kind === 'river' || kind === 'bar') arc(ri(3) - 1, z);
    else if (kind === 'low1' || kind === 'meteor') arc(o.lanes[0], z);
    else if (kind === 'low2') arc(o.lanes[ri(2)], z);
    else if (kind === 'tall2') line(o.free, z + 12, z - 3, 5);
    else { const fl = o.lanes[0] === 0 ? (r() < 0.5 ? -1 : 1) : 0; line(fl, z + 10, z - 3, 4); }
    if (gap > 26) line(ri(3) - 1, z - 9, z - gap + 10, 4);
    z -= gap;
  }
  if (th.boss) for (let i = 0; i < 6; i++) line(i % 3 - 1, -len - 30 - i * 70, -len - 50 - i * 70, 4);
  return { obs, fr, cps, len };
}

  const sun = new THREE.DirectionalLight(key === 'volcano' ? 0xffa070 : sea ? 0x8fd8ff : 0xfff4e0, 0.7); sun.position.set(-20, 40, 10); S.add(sun);
  const course = genCourse(th); const len = course.len;

      cp.passed = true; L.lastCp = cp.z; L.cpFruit = L.fruit;
      if (!cp.boss) { banner('Checkpoint!', 1100); sfx('check'); }
      for (let i = 0; i < 20; i++) L.fx.spawn(rand(-5, 5), rand(2, 5), cp.z, GUM[i % 6], { vy: rand(2, 6), g: 6, size: 0.4, life: 1 });
    }
    if (L.pz < L.finishZ) { L.state = 'finish'; L.fin = 0; banner('FINISH!', 1600); sfx('win'); for (let i = 0; i < 40; i++) L.fx.spawn(rand(-5, 5), rand(3, 7), L.finishZ, GUM[i % 6], { vy: rand(2, 8), vx: rand(-4, 4), g: 6, size: 0.5, life: 1.4 }); }
  }
  if (L.state !== 'count') updateBoss(L, dt, speed);
  // falling fireballs
  for (const o of L.meteors) {
    if (o.hit) continue;
    o.ring.material.opacity = 0.5 + Math.abs(Math.sin(L.t * 8)) * 0.4;
    if (o.z < L.pz + 2 && o.z > L.pz - 48 && (o.fall || 0) < 1) {
      o.fall = Math.min(1, (o.fall || 0) + dt * 1.1); o.rock.visible = true; o.rock.position.y = 40 * (1 - o.fall) * (1 - o.fall);
      if (Math.random() < dt * 30) L.fx.spawn(o.rock.position.x + rand(-0.5, 0.5), o.rock.position.y + 1, o.z, Math.random() < 0.5 ? 0xffd040 : 0xff5a10, { vy: rand(2, 5), g: 0, size: 0.8, grow: 1.5, life: 0.4 });
      if (o.fall >= 1) { sfx('boom'); for (let i = 0; i < 10; i++) L.fx.spawn(o.rock.position.x, 0.5, o.z, 0xff7a10, { vy: rand(3, 7), g: 10, size: 0.5, life: 0.7 }); }
    }
  }
  // spin the visible treats
  for (let j = L.fi; j < L.fruits.length && L.fruits[j].z > L.pz - 90; j++) { const f = L.fruits[j]; if (!f.got) { f.m.rotation.y += dt * 3; f.m.position.y = f.y + Math.sin(L.t * 3 + j) * 0.12; } }
  L.flying = L.flying.filter(o => { const F = o.fly; F.t += dt; F.vy -= 25 * dt; o.g.position.x += F.vx * dt; o.g.position.y += F.vy * dt; o.g.position.z += F.vz * dt; o.g.rotation.z += F.sp * dt; o.g.rotation.x += F.sp * 0.6 * dt; if (F.t > 1.6) { o.g.visible = false; return false; } return true; });
  // ambient effects
  for (const rz of L.riverZs) if (rz < L.pz + 5 && rz > L.pz - 60 && Math.random() < dt * 8) {
    const c = { candy: 0xa0602c, desert: 0xc89a5a, ocean: 0xffffff }[L.key] || (Math.random() < 0.5 ? 0xffd040 : 0xff6a10);
    L.fx.spawn(rand(-12, 12), 0.2, rz + rand(-1.4, 1.4), c, { vy: rand(1, 3), vx: 0, vz: 0, g: L.key === 'candy' ? 6 : L.sea ? -1 : 1, size: 0.3, life: 0.9 });
  }
  if (L.smokeAt && Math.random() < dt * 4) { const p = L.backdrop.position; L.fx.spawn(p.x + L.smokeAt.x + rand(-2, 2), L.smokeAt.y, p.z + L.smokeAt.z, 0x777777, { vy: rand(3, 5), vx: rand(0.5, 2), vz: 0, g: 0, size: 6, grow: 2, op: 0.6, life: 3 }); }
  if (L.eruptAt && Math.random() < dt * 5) { const p = L.backdrop.position; L.fx.spawn(p.x + L.eruptAt.x, L.eruptAt.y, p.z + L.eruptAt.z, Math.random() < 0.5 ? 0xffb020 : 0xff4a10, { vy: rand(10, 18), vx: rand(-6, 6), vz: rand(-2, 2), g: 9, size: 2.5, life: 2.4 }); }
  if (L.key === 'volcano' && Math.random() < dt * 6) L.fx.spawn(L.px + rand(-12, 12), rand(6, 12), L.pz - rand(5, 40), 0xff8a30, { vy: rand(-1, 0.5), vx: rand(-0.5, 0.5), g: 0, size: 0.15, life: 2 });
  if (L.bubbles && Math.random() < dt * 14) L.fx.spawn(L.px + rand(-10, 10), rand(0, 3), L.pz - rand(0, 30), 0xe8fbff, { vy: rand(1.5, 3), vx: 0, vz: 0, g: -0.5, size: rand(0.12, 0.3), life: 2.5, op: 0.7 });
  if (speed > 1 && !air && Math.random() < dt * 14) dustPuff(L);
  for (const w of L.walkers) {
    if (Math.abs(w.g.position.z - L.pz) > 150) continue;
    w.phase += dt * w.speed * 1.2; w.g.position.z -= w.speed * dt;
    w.legs.forEach((l, i) => l.rotation.x = Math.sin(w.phase + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.5);
    if (!w.legs.length) w.g.position.y += Math.sin(w.phase) * dt * 0.5;
  }
  for (const cp of L.cps) cp.flags.forEach((f, i) => f.rotation.y = Math.sin(L.t * 5 + i) * 0.4);
  // rider
  const r = L.rider;
  r.root.position.set(L.px, L.py, L.pz);
  r.root.rotation.z = -(tx - L.px) * 0.1; r.root.rotation.y = -(tx - L.px) * 0.09;
  r.shadow.position.y = 0.06 - L.py; r.shadow.material.opacity = Math.max(0.2, 1 - L.py * 0.25);
  animRider(r, dt, L.state === 'count' ? 0.15 : speed / 14, air);
  r.root.visible = L.inv > 0 && L.state === 'run' ? Math.floor(L.inv * 12) % 2 === 0 : true;
  // Milo
  if (L.milo) {
    const M = L.milo; M.t += dt;
    const side = L.px > 0.5 ? -1 : 1;
    M.x += (L.px + side * 1.7 - M.x) * Math.min(1, dt * 8);
    M.y += (L.py * 0.9 - M.y) * Math.min(1, dt * 9);
    if (M.state === 'with') M.zo += (0.8 - M.zo) * dt * 4;
    else if (M.state === 'away') { M.zo += dt * 14; if (M.zo > 25) M.m.g.visible = false; if (M.t > 20 && L.state === 'run') { M.state = 'back'; M.zo = 18; M.m.g.visible = true; } }
    else if (M.state === 'back') { M.zo -= dt * 8; if (M.zo < 0.9) { M.state = 'with'; banner('Milo is back! 🐶', 1100); sfx('bark'); updateHUD(); } }
    M.m.g.position.set(M.x, M.y + (L.sea ? 0.8 : 0), L.pz + M.zo);
    M.m.g.rotation.y = M.state === 'away' ? Math.PI : 0;
    animMilo(M.m, dt, L.state === 'count' ? 0.2 : speed > 0 ? 1.2 : 0);
  }
  // camera
  const back = portrait ? 12.5 : 9.5, up = an.camH + (portrait ? 1.6 : 0);
  const k = 1 - Math.exp(-dt * 6);
  camera.position.x += (L.px * 0.65 - camera.position.x) * k;
  camera.position.y += (up + L.py * 0.35 - camera.position.y) * k;
  camera.position.z = L.pz + back;
  camera.lookAt(L.px * 0.75, an.camH * 0.42 + L.py * 0.3, L.pz - 14);
  if (L.shake > 0) { L.shake -= dt; camera.position.x += rand(-1, 1) * L.shake * 0.6; camera.position.y += rand(-1, 1) * L.shake * 0.6; }
  L.backdrop.position.set(0, 0, camera.position.z);
  const pp = clamp(-L.pz / L.progLen, 0, 1) * 100;
  $('prog').querySelector('.fill').style.width = pp + '%';
  $('prog').querySelector('.who').style.left = pp + '%';
}
function finishLevel(L) {
  const before = totalStars(), opened = Object.keys(THEMES).filter(isOpen);
  const stars = starsFor(L.fruit, L.total);
  const b = save.best[L.key];
  save.best[L.key] = { stars: Math.max(stars, b ? b.stars : 0), fruit: Math.max(L.fruit, b ? b.fruit : 0) };
  save.done[L.key] = true;
  const after = totalStars(), news = [];
  for (const k in THEMES) if (isOpen(k) && !opened.includes(k)) news.push(`${THEMES[k].em} ${THEMES[k].name} is open!`);
  if (before < MILO_NEED && after >= MILO_NEED) { news.push('🐶 Milo the sausage dog joins you!'); save.friend = 'milo'; }
  for (const o of OUTFITS) if (o.need > before && o.need <= after) news.push(`New outfit: ${o.em} ${o.name}!`);
  persist(); refreshLocks();
  $('resTitle').textContent = { candy: 'Sweet, Iyla!', ocean: 'Splashtastic, Iyla!', volcano: 'Red hot, Iyla!' }[L.key] || 'Hooray, Iyla!';
  $('resBody').innerHTML = `<span class="stars">${starStr(stars)}</span>${L.th.fruitEm} ${L.fruit} of ${L.total} ${L.th.fruitName}` + news.map(n => `<span class="new">${n}</span>`).join('');
  show('lvlUI', false); show('result', true);
}
function goMap() {
  sfx('click'); disposeLevel(); paused = false;
  ['lvlUI', 'pause', 'result', 'fail', 'title', 'select'].forEach(id => show(id, false));
  show('mapUI', true); mode = 'map'; startMusic('map');
  camera.far = 400; camera.updateProjectionMatrix();
  setRider(save.animal); refreshLocks();
  W.pos.y = heightAt(W.pos.x, W.pos.z);
  camera.position.set(W.pos.x, W.pos.y + 15, W.pos.z + 15);
  W.near = null; W.target = null; W.marker.visible = false;
  $('mapHint').style.opacity = 1; setTimeout(() => $('mapHint').style.opacity = 0, 7000);
}

/* =====================================================================
   SCREENS & INPUT
   ===================================================================== */
let selTab = 'ride';
function buildCards() {
  const c = $('cards'); c.innerHTML = '';
  const stars = totalStars();
  $('selTitle').innerHTML = `Get ready! <small>★ ${stars}</small>`;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.t === selTab));
  const add = (k, em, name, desc, on, need, fn) => {
    const locked = need > stars; const d = document.createElement('div');
    d.className = 'card' + (on ? ' on' : '') + (locked ? ' locked' : ''); d.dataset.k = k;
    d.innerHTML = `<div class="em">${locked ? '🔒' : em}</div><b>${name}</b><i>${locked ? `Collect ★ ${need} to unlock` : desc}</i>`;
    d.addEventListener('click', () => { if (locked) { sfx('bonk'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake'); return; } fn(); });
    c.appendChild(d);
  };
  if (selTab === 'ride') LAND.forEach(k => add(k, ANIMALS[k].em, ANIMALS[k].name, ANIMALS[k].desc, k === save.animal, 0, () => pickAnimal(k)));
  if (selTab === 'sea') SEA.forEach(k => add(k, ANIMALS[k].em, ANIMALS[k].name, ANIMALS[k].desc, k === save.sea, 0, () => pickSea(k)));
  if (selTab === 'outfit') OUTFITS.forEach(o => add(o.k, o.em, o.name, 'Tap to wear', o.k === save.outfit, o.need, () => pickOutfit(o.k)));
  if (selTab === 'friend') {
    add('none', '🙅', 'No friend', 'Ride on your own', save.friend !== 'milo', 0, () => pickFriend(''));
    add('milo', '🐶', 'Milo', 'Sausage dog! Saves you when you get hurt, and grabs treats', save.friend === 'milo' && miloOpen(), MILO_NEED, () => pickFriend('milo'));
  }
  const on = c.querySelector('.card.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function previewRide() {
  const kind = selTab === 'sea' ? save.sea : save.animal;
  const ry = W.rider ? W.rider.root.rotation.y : 0;
  if (W.rider) W.scene.remove(W.rider.root);
  W.rider = buildRider(kind, save.outfit, false); W.scene.add(W.rider.root); W.rider.root.rotation.y = ry; W.rider.root.position.copy(W.pos);
  $('rideBtn').textContent = ANIMALS[save.animal].em + ' Change';
  setMapMilo();
}
function pickAnimal(k) { audioInit(); sfx('click'); save.animal = k; persist(); buildCards(); previewRide(); }
function pickSea(k) { audioInit(); sfx('click'); save.sea = k; persist(); buildCards(); previewRide(); }
function pickOutfit(k) { audioInit(); sfx('click'); save.outfit = k; persist(); buildCards(); previewRide(); }
function pickFriend(f) { audioInit(); save.friend = f; persist(); if (f) sfx('bark'); else sfx('click'); buildCards(); setMapMilo(); }
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => { audioInit(); sfx('click'); selTab = t.dataset.t; buildCards(); previewRide(); }));
function goSelect() {
  audioInit(); sfx('click');
  ['title', 'mapUI'].forEach(id => show(id, false)); $('pop').classList.remove('on'); W.near = null;
  show('select', true); mode = 'select'; buildCards(); previewRide(); startMusic('map');
}
$('title').addEventListener('pointerdown', () => {
  audioInit();
  const el = document.documentElement;
  if (matchMedia('(pointer:coarse)').matches && el.requestFullscreen) el.requestFullscreen().catch(() => { });
  goSelect();
});
$('title').style.pointerEvents = 'auto';
$('goBtn').addEventListener('click', () => { W.face = 0; selTab = 'ride'; goMap(); });
$('rideBtn').addEventListener('click', goSelect);
$('muteBtn').addEventListener('click', () => { audioInit(); setMuted(!save.muted); });
$('popPlay').addEventListener('click', () => { if (W.near && isOpen(W.near)) startLevel(W.near); });
$('pauseBtn').addEventListener('click', () => setPaused(true));
$('resumeBtn').addEventListener('click', () => setPaused(false));
$('restartBtn').addEventListener('click', () => { paused = false; startLevel(LV.key); });
$('quitBtn').addEventListener('click', goMap);
$('resMap').addEventListener('click', goMap);
$('resAgain').addEventListener('click', () => startLevel(LV.key));
$('failMap').addEventListener('click', goMap);
$('failRetry').addEventListener('click', () => {
  sfx('click'); const L = LV; show('fail', false); show('lvlUI', true);
  resetRun(L, L.lastCp); startMusic(L.th.music);
});
function setPaused(p) {
  if (mode !== 'level' || !LV) return;
  if (p && (LV.state === 'dead' || LV.state === 'finish')) return;
  paused = p; show('pause', p); sfx('click');
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (mode === 'level' && LV && LV.state === 'run') setPaused(true); if (AC) AC.suspend(); } else if (AC) AC.resume(); });

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let ptr = null;
function mapTarget(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(W.walk, false)[0];
  if (hit) { W.target = new THREE.Vector3(hit.point.x, 0, hit.point.z); W.marker.position.set(hit.point.x, hit.point.y + 0.08, hit.point.z); W.marker.visible = true; }
}
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  audioInit();
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, used: false };
  if (mode === 'map') mapTarget(e);
});
cv.addEventListener('pointermove', e => {
  if (!ptr || ptr.id !== e.pointerId) return;
  if (mode === 'map') { mapTarget(e); return; }
  if (mode !== 'level' || paused || ptr.used) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, th = Math.min(innerWidth, innerHeight) * 0.06;
  if (Math.abs(dx) > th && Math.abs(dx) > Math.abs(dy)) { steer(dx > 0 ? 1 : -1); ptr.used = true; }
  else if (dy < -th) { if (LV.state === 'run' || LV.state === 'count') doJump(LV); ptr.used = true; }
});
function ptrEnd(e) {
  if (!ptr || ptr.id !== e.pointerId) return;
  if (mode === 'level' && !paused && !ptr.used && LV && (LV.state === 'run' || LV.state === 'count')) {
    const fx = e.clientX / innerWidth;
    if (fx < 0.3) steer(-1); else if (fx > 0.7) steer(1); else doJump(LV);
  }
  ptr = null;
}
cv.addEventListener('pointerup', ptrEnd);
cv.addEventListener('pointercancel', () => { ptr = null; });
addEventListener('keydown', e => {
  keys[e.code] = true; audioInit();
  if (mode === 'title') { goSelect(); return; }
  if (mode === 'select') {
    if (e.code === 'Enter' || e.code === 'Space') { W.face = 0; selTab = 'ride'; goMap(); }
    return;
  }
  if (mode === 'map') {
    if ((e.code === 'Enter' || e.code === 'Space') && W.near && isOpen(W.near)) startLevel(W.near);
    if (e.code === 'KeyM') setMuted(!save.muted);
    return;
  }
  if (mode === 'level') {
    if (e.code === 'Escape' || e.code === 'KeyP') { setPaused(!paused); return; }
    if (e.code === 'KeyM') setMuted(!save.muted);
    if (paused || e.repeat) return;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') steer(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') steer(1);
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (LV.state === 'run' || LV.state === 'count') doJump(LV); }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'level' && LV) { if (!paused) updateLevel(dt); renderer.render(LV.scene, camera); }
  else if (W.scene) { updateWorld(dt); renderer.render(W.scene, camera); }
}
function boot() {
  buildWorld();
  setMuted(save.muted); refreshLocks(); persist();
  $('loading').remove();
  mode = 'title'; show('title', true);
  requestAnimationFrame(frame);
  window.__iyla = { W, get LV() { return LV; }, startLevel, goMap, save, updateLevel, steer, doJump, totalStars };
}
Promise.race([document.fonts ? document.fonts.load('700 80px Fredoka') : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).catch(() => { }).then(boot);
</script>
