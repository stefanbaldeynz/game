<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Coin Dash</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="back-link" href="../index.html">&larr; Game select</a>
  <h1>Coin Dash</h1>
  <canvas id="game" width="640" height="480"></canvas>
  <p class="help">Move with arrow keys or WASD. Grab coins and dodge the red blocks. Press Space to restart.</p>
  <script src="../shared/touch-controls.js"></script>
  <script src="game.js"></script>
  <script>
    TouchControls.setup({
      stick: { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' },
      stickAnywhere: true,
      menu: () => state.over,
      menuKey: ' ',
      menuHint: 'Tap to play again',
    });
  </script>
</body>
</html>
