<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#ff7eb6">
<title>Isla's Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#ffd3ec;font-family:'Fredoka',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
canvas#gl{position:fixed;inset:0;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.scr.on{display:flex}
.scr .pe,.scr button{pointer-events:auto}
.dim{background:radial-gradient(ellipse at center,rgba(90,20,70,.25),rgba(60,10,50,.6))}
.btn{font:700 clamp(18px,4.6vmin,30px) 'Fredoka',system-ui,sans-serif;color:#fff;background:linear-gradient(#ff9fd0,#ff4f9a);border:4px solid #fff;border-radius:999px;padding:.4em 1.3em;box-shadow:0 6px 0 #c2276b,0 10px 18px rgba(0,0,0,.25);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.2);margin:.3em}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c2276b}
.btn.green{background:linear-gradient(#8ee88a,#2fae4a);box-shadow:0 6px 0 #1d7a31,0 10px 18px rgba(0,0,0,.25)}
.btn.blue{background:linear-gradient(#8fd6ff,#3a8fe0);box-shadow:0 6px 0 #1f5c9e,0 10px 18px rgba(0,0,0,.25)}
.btn.small{font-size:clamp(14px,3.4vmin,20px);padding:.3em .9em;border-width:3px}
.logo{font-weight:700;font-size:clamp(54px,15vmin,130px);line-height:.95;color:#ffe14d;-webkit-text-stroke:3px #a02a6a;paint-order:stroke fill;text-shadow:0 6px 0 #a02a6a,0 12px 22px rgba(0,0,0,.3);transform:rotate(-4deg);animation:bob 2.4s ease-in-out infinite}
.logo small{display:block;font-size:.34em;color:#fff;-webkit-text-stroke:2px #a02a6a;margin-top:.2em}
@keyframes bob{50%{transform:rotate(-2deg) translateY(-8px)}}
.tap{margin-top:6vh;font-size:clamp(22px,5.5vmin,36px);font-weight:700;color:#fff;-webkit-text-stroke:1.5px #a02a6a;paint-order:stroke fill;text-shadow:0 3px 0 #a02a6a;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
h2.t{margin:0;font-size:clamp(30px,8vmin,64px);color:#fff;-webkit-text-stroke:2px #a02a6a;paint-order:stroke fill;text-shadow:0 4px 0 #a02a6a,0 8px 16px rgba(0,0,0,.25)}
#select{justify-content:space-between}
.cards{display:flex;gap:2.2vmin;justify-content:center;margin-bottom:1vh}
.card{width:clamp(92px,27vmin,175px);background:rgba(255,255,255,.88);color:#6a2350;border-radius:20px;padding:8px 6px;border:4px solid #fff;cursor:pointer;box-shadow:0 6px 0 rgba(160,42,106,.5);transition:transform .15s}
.card.on{border-color:#ff4f9a;background:#fff;transform:translateY(-6px) scale(1.05)}
.card .em{font-size:clamp(30px,9vmin,58px);line-height:1.1}
.card b{display:block;font-size:clamp(16px,4.2vmin,26px)}
.card i{display:block;font-style:normal;font-size:clamp(11px,2.8vmin,15px);line-height:1.2;min-height:2.4em}
/* map */
#mapUI .tl{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));display:flex;gap:6px}
#mapUI .tr{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right))}
.hintbar{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:rgba(255,255,255,.88);color:#6a2350;font-weight:700;padding:.45em 1em;border-radius:999px;font-size:clamp(13px,3.4vmin,20px);white-space:nowrap;box-shadow:0 4px 0 rgba(160,42,106,.4);transition:opacity .6s}
#pop{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);transition:transform .35s cubic-bezier(.3,1.5,.5,1);background:rgba(255,255,255,.95);color:#6a2350;border-radius:24px;padding:12px 18px;border:4px solid #ffb3d6;box-shadow:0 10px 30px rgba(0,0,0,.3);min-width:min(86vw,360px);pointer-events:auto}
#pop.on{transform:translateX(-50%) translateY(0)}
#pop h3{margin:0;font-size:clamp(22px,6vmin,34px)}
#pop p{margin:.2em 0 .4em;font-size:clamp(13px,3.4vmin,18px)}
#pop .stars{font-size:clamp(20px,5vmin,28px);color:#ffb400;letter-spacing:.1em}
#lockBtn{font-size:clamp(28px,7vmin,44px);cursor:pointer;display:inline-block}
/* level hud */
#lvlUI .row{position:fixed;top:max(8px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));display:flex;align-items:center;gap:10px}
.pill{background:rgba(255,255,255,.85);color:#6a2350;font-weight:700;border-radius:999px;padding:.15em .6em;font-size:clamp(18px,4.6vmin,30px);box-shadow:0 3px 0 rgba(160,42,106,.4);white-space:nowrap}
#hearts{letter-spacing:.05em}
#prog{flex:1;height:clamp(14px,3vmin,20px);background:rgba(255,255,255,.6);border-radius:999px;position:relative;border:3px solid #fff;box-shadow:0 3px 0 rgba(160,42,106,.4)}
#prog .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(90deg,#ffd84a,#ff7eb6)}
#prog .who{position:absolute;top:50%;transform:translate(-50%,-55%);font-size:clamp(20px,5vmin,30px)}
#prog .end{position:absolute;right:-6px;top:50%;transform:translateY(-55%);font-size:clamp(18px,4.4vmin,26px)}
#prog .cp{position:absolute;top:-3px;bottom:-3px;width:4px;background:#fff;border-radius:2px}
#pauseBtn{pointer-events:auto;width:clamp(40px,9vmin,52px);height:clamp(40px,9vmin,52px);border-radius:50%;border:3px solid #fff;background:#ff6fae;color:#fff;font:700 clamp(16px,4vmin,22px) 'Fredoka';box-shadow:0 3px 0 #c2276b;cursor:pointer;padding:0}
#zones{position:fixed;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 4vw;transition:opacity 1s}
#zones div{background:rgba(255,255,255,.7);color:#6a2350;font-weight:700;border-radius:16px;padding:.35em .8em;font-size:clamp(14px,3.6vmin,22px)}
#banner{position:fixed;left:0;right:0;top:24%;text-align:center;font-weight:700;font-size:clamp(44px,13vmin,110px);color:#ffe14d;-webkit-text-stroke:3px #a02a6a;paint-order:stroke fill;text-shadow:0 6px 0 #a02a6a;pointer-events:none;opacity:0;transform:scale(.4) rotate(-6deg);transition:opacity .2s,transform .35s cubic-bezier(.3,1.7,.5,1)}
#banner.on{opacity:1;transform:scale(1) rotate(-4deg)}
#hint{position:fixed;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + clamp(52px,12vmin,72px));transform:translateX(-50%) scale(.6);opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.3,1.7,.5,1);background:#fff;color:#a02a6a;font-weight:700;border-radius:18px;padding:.35em .9em;font-size:clamp(16px,4.4vmin,28px);box-shadow:0 5px 0 rgba(160,42,106,.45);pointer-events:none;white-space:nowrap}
#hint.on{opacity:1;transform:translateX(-50%) scale(1)}
.big{font-size:clamp(40px,11vmin,90px);font-weight:700;color:#ffe14d;-webkit-text-stroke:3px #a02a6a;paint-order:stroke fill;text-shadow:0 6px 0 #a02a6a;line-height:1}
.res{font-size:clamp(20px,5vmin,34px);font-weight:700;margin:.3em 0 .5em;text-shadow:0 3px 0 rgba(160,42,106,.8)}
.res .stars{display:block;font-size:clamp(38px,10vmin,70px);color:#ffcf1a;-webkit-text-stroke:2px #a0601a;letter-spacing:.08em}
#muteBtn{min-width:2.6em}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#a02a6a;background:#ffd3ec}
@media (max-height:480px){.tap{margin-top:3vh}.card i{display:none}}
</style>
</head>
<body>
<div id="loading">Loading Isla's Game…</div>

<div class="scr" id="title">
  <div class="logo">Isla's Game<small>Wild rides across Africa!</small></div>
  <div class="tap">Tap to play!</div>
</div>

<div class="scr" id="select">
  <h2 class="t">Pick your ride!</h2>
  <div>
    <div class="cards pe" id="cards"></div>
    <button class="btn green" id="goBtn">Let's ride! ▶</button>
  </div>
</div>

<div class="scr" id="mapUI">
  <div class="tl"><button class="btn small pe" id="rideBtn">🦒 Change ride</button></div>
  <div class="tr"><button class="btn small blue pe" id="muteBtn">🔊</button></div>
  <div class="hintbar" id="mapHint">Tap where you want to go · ride into a gate to play!</div>
  <div id="pop">
    <h3 id="popTitle"></h3>
    <p id="popDesc"></p>
    <div class="stars" id="popStars"></div>
    <div id="popLock" style="display:none"><span id="lockBtn">🔒</span><p>Finish the <b>Serengeti</b> to open Candyland!</p></div>
    <button class="btn green" id="popPlay">Play! ▶</button>
  </div>
</div>

<div class="scr" id="lvlUI">
  <div class="row">
    <div class="pill" id="hearts"></div>
    <div id="prog"><div class="fill"></div><div class="end">🏁</div><div class="who"></div></div>
    <div class="pill" id="fruitPill"></div>
    <button id="pauseBtn">❚❚</button>
  </div>
  <div id="zones"><div>◀ tap</div><div>tap middle to JUMP</div><div>tap ▶</div></div>
</div>

<div class="scr dim" id="pause">
  <div class="big">Paused</div>
  <div style="margin-top:3vh">
    <button class="btn green" id="resumeBtn">Keep going ▶</button><br>
    <button class="btn blue small" id="restartBtn">Start again</button>
    <button class="btn small" id="quitBtn">Back to the map</button>
  </div>
</div>

<div class="scr dim" id="result">
  <div class="big" id="resTitle">Hooray, Isla!</div>
  <div class="res" id="resBody"></div>
  <div>
    <button class="btn green" id="resMap">To the map ▶</button>
    <button class="btn blue" id="resAgain">Play again</button>
  </div>
</div>

<div class="scr dim" id="fail">
  <div class="big">Oh no!</div>
  <div class="res">Out of hearts. Try again from the last flag?</div>
  <div>
    <button class="btn green" id="failRetry">Try again ▶</button>
    <button class="btn small" id="failMap">Back to the map</button>
  </div>
</div>

<div id="banner"></div>
<div id="hint"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
   ISLA'S GAME
   Isla rides a giraffe, hippo or lion across an African overworld and
   through two auto-running levels: the Serengeti (lava streams, rocks)
   and Candyland (hot fudge, gumdrops, candy canes).
   Everything (models, textures, music) is made in code in this file.
   ===================================================================== */
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- save ---------------- */
const SAVE_KEY = 'islasGame1';
const save = Object.assign({ candy: false, best: {}, animal: 'giraffe', muted: false },
  (() => { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); } catch (e) { return {}; } })());
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }

/* ---------------- rides ---------------- */
const ANIMALS = {
  giraffe: { name: 'Giraffe', em: '🦒', desc: 'Super high jumps!', jump: 13, hearts: 3, speed: 1, steer: 11, magnet: 1.5, camH: 7.5 },
  hippo: { name: 'Hippo', em: '🦛', desc: 'Extra tough: 5 hearts!', jump: 11.2, hearts: 5, speed: 0.92, steer: 10, magnet: 1.5, camH: 5.3 },
  lion: { name: 'Lion', em: '🦁', desc: 'Super fast and grabs more treats!', jump: 11.6, hearts: 3, speed: 1.1, steer: 15, magnet: 2.5, camH: 5.3 },
};
const GRAV = 30, LANE = 2.4;

const THEMES = {
  serengeti: {
    key: 'serengeti', name: 'Serengeti Stampede', em: '🌍', len: 1250, seed: 2024,
    desc: 'Race across the savanna! Jump the lava streams and dodge the rocks.',
    sky: ['#4fb0ee', '#a9dcf5', '#ffe2a8'], fog: 0xf5ddb0, ground: 'savanna', path: 'dirt', river: 'lava',
    hemi: [0xe6f4ff, 0xa9864b], fruitEm: '🥭', fruitName: 'mangoes',
    hints: { low: 'Jump the rocks, or move past them!', river: 'Jump over the lava!', bar: 'Jump over the log!', tall: 'Too tall! Move to dodge it!' },
  },
  candy: {
    key: 'candy', name: 'Candyland', em: '🍭', len: 1300, seed: 7331,
    desc: 'A sugary sweet ride! Jump the hot fudge and the candy canes.',
    sky: ['#ff8fd0', '#ffc6e8', '#c8f2ff'], fog: 0xffd6ee, ground: 'candyGround', path: 'candyPath', river: 'fudge',
    hemi: [0xfff0fa, 0xc58fb0], fruitEm: '🍬', fruitName: 'sweets',
    hints: { low: 'Jump the gumdrops!', river: 'Jump over the hot fudge!', bar: 'Jump the candy cane!', tall: 'Giant lolly! Move to dodge it!' },
  },
};

/* ---------------- renderer ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.domElement.id = 'gl';
document.body.prepend(renderer.domElement);
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
let portrait = false;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  portrait = h > w;
  camera.aspect = w / h;
  camera.fov = portrait ? 72 : 58;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

/* ---------------- textures (all painted in code) ---------------- */
function cnv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
const PAINT = {
  savanna(x, w, h) {
    x.fillStyle = '#c9b25e'; x.fillRect(0, 0, w, h);
    const cols = ['#bea14b', '#e2ca7c', '#a99a45', '#c9b45c', '#9fae4e'];
    x.lineWidth = 2;
    for (let i = 0; i < 1500; i++) {
      x.strokeStyle = cols[i % 5]; const px = Math.random() * w, py = Math.random() * h;
      x.beginPath(); x.moveTo(px, py); x.lineTo(px + rand(-3, 3), py - rand(4, 11)); x.stroke();
    }
  },
  dirt(x, w, h) {
    x.fillStyle = '#c99359'; x.fillRect(0, 0, w, h);
    const cols = ['#b07a45', '#dca86f', '#9c6a3c', '#d39c62'];
    for (let i = 0; i < 700; i++) { x.fillStyle = cols[i % 4]; x.beginPath(); x.arc(Math.random() * w, Math.random() * h, rand(1, 3.5), 0, TAU); x.fill(); }
  },
  lava(x, w, h) {
    x.fillStyle = '#ff5200'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) {
      const px = Math.random() * w, py = Math.random() * h, r = rand(8, 30);
      const g = x.createRadialGradient(px, py, 0, px, py, r);
      g.addColorStop(0, '#fff27a'); g.addColorStop(0.5, '#ffb000'); g.addColorStop(1, 'rgba(255,82,0,0)');
      x.fillStyle = g; x.fillRect(px - r, py - r, r * 2, r * 2);
    }
    for (let i = 0; i < 22; i++) {
      x.fillStyle = 'rgba(90,20,6,.75)'; x.beginPath();
      x.ellipse(Math.random() * w, Math.random() * h, rand(6, 18), rand(3, 8), Math.random() * 3, 0, TAU); x.fill();
    }
  },
  candyGround(x, w, h) {
    x.fillStyle = '#aef2d2'; x.fillRect(0, 0, w, h);
    const cols = ['#ff5fa8', '#ffd84a', '#6fc8ff', '#b98cff', '#ffffff', '#ff8a3d'];
    for (let i = 0; i < 160; i++) {
      x.save(); x.translate(Math.random() * w, Math.random() * h); x.rotate(Math.random() * TAU);
      x.fillStyle = cols[i % cols.length]; x.fillRect(-6, -2, 12, 4); x.restore();
    }
  },
  candyPath(x, w, h) {
    x.fillStyle = '#fff0f7'; x.fillRect(0, 0, w, h); x.fillStyle = '#ff8cc4';
    for (let i = -h; i < w + h; i += 64) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 30, 0); x.lineTo(i + 30 - h, h); x.lineTo(i - h, h); x.fill(); }
  },
  fudge(x, w, h) {
    x.fillStyle = '#7a4321'; x.fillRect(0, 0, w, h);
    x.lineWidth = 6; x.lineCap = 'round';
    for (let i = 0; i < 40; i++) { x.strokeStyle = i % 3 ? '#9c5a2c' : '#c98c58'; x.beginPath(); x.arc(Math.random() * w, Math.random() * h, rand(8, 26), rand(0, 3), rand(3, 6)); x.stroke(); }
  },
  cane(x, w, h) {
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.fillStyle = '#e8203a';
    for (let i = -h; i < w + h; i += 64) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i + 26, 0); x.lineTo(i + 26 - h, h); x.lineTo(i - h, h); x.fill(); }
  },
  lolly(x, w, h) {
    x.fillStyle = '#fff'; x.fillRect(0, 0, w, h);
    const cols = ['#ff4f9a', '#ffd84a', '#5fc8ff', '#8be06a'];
    x.lineWidth = 20; x.lineCap = 'round';
    for (let arm = 0; arm < 4; arm++) {
      x.strokeStyle = cols[arm]; x.beginPath();
      for (let a = 0; a < 5 * Math.PI; a += 0.1) { const r = a / (5 * Math.PI) * 120; const px = 128 + Math.cos(a + arm * Math.PI / 2) * r, py = 128 + Math.sin(a + arm * Math.PI / 2) * r; a ? x.lineTo(px, py) : x.moveTo(px, py); }
      x.stroke();
    }
  },
  giraffe(x, w, h) {
    x.fillStyle = '#f6c752'; x.fillRect(0, 0, w, h); x.fillStyle = '#a0571f';
    const n = 6, s = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const cx = (i + 0.5 + (j % 2) * 0.3) * s, cy = (j + 0.5) * s; x.beginPath();
      for (let k = 0; k < 6; k++) { const a = k / 6 * TAU + rand(-0.3, 0.3), r = s * rand(0.32, 0.42); x.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
      x.fill();
    }
  },
  zebra(x, w, h) {
    x.fillStyle = '#fafafa'; x.fillRect(0, 0, w, h); x.fillStyle = '#222';
    for (let i = 0; i < 12; i++) {
      x.beginPath(); const x0 = i * w / 12;
      for (let y = 0; y <= h; y += 16) x.lineTo(x0 + Math.sin(y * 0.05 + i) * 6, y);
      for (let y = h; y >= 0; y -= 16) x.lineTo(x0 + 9 + Math.sin(y * 0.05 + i) * 6, y);
      x.fill();
    }
  },
  checker(x, w, h) {
    const s = w / 16;
    for (let i = 0; i < 16; i++) for (let j = 0; j < 4; j++) { x.fillStyle = (i + j) % 2 ? '#222' : '#fff'; x.fillRect(i * s, j * h / 4, s, h / 4); }
  },
  glow(x, w, h) {
    const g = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.4, 'rgba(255,255,255,.8)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  },
  shadow(x, w, h) {
    const g = x.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    g.addColorStop(0, 'rgba(0,0,0,.42)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
  },
};
const CANV = {}, TEX = {};
function texOf(name, rx = 1, ry = 1) {
  const key = name + '|' + rx + '|' + ry;
  if (TEX[key]) return TEX[key];
  if (!CANV[name]) { const [c, x] = cnv(256, 256); PAINT[name](x, 256, 256); CANV[name] = c; }
  const t = new THREE.CanvasTexture(CANV[name]);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return TEX[key] = t;
}
function skyTex(cols) {

      if (Math.hypot(f.x - L.px, f.y - cy, f.z - L.pz) < an.magnet) {
        f.got = true; f.m.visible = false; L.fruit++; sfx('collect'); updateHUD();
        for (let i = 0; i < 6; i++) L.fx.spawn(f.x, f.y, f.z, L.key === 'candy' ? GUM[i] : 0xffc020, { vy: rand(1, 4), g: 6, size: 0.35, life: 0.5 });
      }
    }
    // checkpoints & finish
    for (const cp of L.cps) if (!cp.passed && L.pz < cp.z) { cp.passed = true; L.lastCp = cp.z; L.cpFruit = L.fruit; banner('Checkpoint!', 1100); sfx('check'); for (let i = 0; i < 20; i++) L.fx.spawn(rand(-5, 5), rand(2, 5), cp.z, GUM[i % 6], { vy: rand(2, 6), g: 6, size: 0.4, life: 1 }); }
    if (L.pz < -L.len) { L.state = 'finish'; L.fin = 0; banner('FINISH!', 1600); sfx('win'); for (let i = 0; i < 40; i++) L.fx.spawn(rand(-5, 5), rand(3, 7), -L.len, GUM[i % 6], { vy: rand(2, 8), vx: rand(-4, 4), g: 6, size: 0.5, life: 1.4 }); }
  }
  // spin the visible treats
  for (let j = L.fi; j < L.fruits.length && L.fruits[j].z > L.pz - 90; j++) { const f = L.fruits[j]; if (!f.got) { f.m.rotation.y += dt * 3; f.m.position.y = f.y + Math.sin(L.t * 3 + j) * 0.12; } }
  // knocked-away obstacles
  L.flying = L.flying.filter(o => { const F = o.fly; F.t += dt; F.vy -= 25 * dt; o.g.position.x += F.vx * dt; o.g.position.y += F.vy * dt; o.g.position.z += F.vz * dt; o.g.rotation.z += F.sp * dt; o.g.rotation.x += F.sp * 0.6 * dt; if (F.t > 1.6) { o.g.visible = false; return false; } return true; });
  // lava embers / fudge bubbles near the player
  for (const rz of L.riverZs) if (rz < L.pz + 5 && rz > L.pz - 60 && Math.random() < dt * 8) L.fx.spawn(rand(-12, 12), 0.2, rz + rand(-1.4, 1.4), L.key === 'candy' ? 0xa0602c : (Math.random() < 0.5 ? 0xffd040 : 0xff6a10), { vy: rand(2, 4), vx: 0, vz: 0, g: L.key === 'candy' ? 6 : 1, size: L.key === 'candy' ? 0.35 : 0.3, life: 0.9 });
  if (L.smokeAt && Math.random() < dt * 4) { const p = L.backdrop.position; L.fx.spawn(p.x + L.smokeAt.x + rand(-2, 2), L.smokeAt.y, p.z + L.smokeAt.z, 0x777777, { vy: rand(3, 5), vx: rand(0.5, 2), vz: 0, g: 0, size: 6, grow: 2, op: 0.6, life: 3 }); }
  if (speed > 1 && !air && Math.random() < dt * 14) dustPuff(L);
  // walkers & flags
  for (const w of L.walkers) {
    if (Math.abs(w.g.position.z - L.pz) > 150) continue;
    w.phase += dt * w.speed * 1.2; w.g.position.z -= w.speed * dt;
    w.legs.forEach((l, i) => l.rotation.x = Math.sin(w.phase + (i === 0 || i === 3 ? 0 : Math.PI)) * 0.5);
  }
  for (const cp of L.cps) cp.flags.forEach((f, i) => f.rotation.y = Math.sin(L.t * 5 + i) * 0.4);
  // rider pose
  const r = L.rider;
  r.root.position.set(L.px, L.py, L.pz);
  r.root.rotation.z = -(tx - L.px) * 0.1; r.root.rotation.y = -(tx - L.px) * 0.09;
  r.shadow.position.y = 0.06 - L.py; r.shadow.material.opacity = Math.max(0.2, 1 - L.py * 0.25);
  animRider(r, dt, L.state === 'count' ? 0.15 : speed / 14, air);
  r.root.visible = L.inv > 0 && L.state === 'run' ? Math.floor(L.inv * 12) % 2 === 0 : true;
  // camera
  const back = portrait ? 12.5 : 9.5, up = an.camH + (portrait ? 1.6 : 0);
  const k = 1 - Math.exp(-dt * 6);
  camera.position.x += (L.px * 0.65 - camera.position.x) * k;
  camera.position.y += (up + L.py * 0.35 - camera.position.y) * k;
  camera.position.z = L.pz + back;
  camera.lookAt(L.px * 0.75, an.camH * 0.42 + L.py * 0.3, L.pz - 14);
  if (L.shake > 0) { L.shake -= dt; camera.position.x += rand(-1, 1) * L.shake * 0.6; camera.position.y += rand(-1, 1) * L.shake * 0.6; }
  L.backdrop.position.set(0, 0, camera.position.z);
  // hud progress
  const pp = clamp(-L.pz / L.len, 0, 1) * 100;
  $('prog').querySelector('.fill').style.width = pp + '%';
  $('prog').querySelector('.who').style.left = pp + '%';
}
function finishLevel(L) {
  const stars = starsFor(L.fruit, L.total);
  const b = save.best[L.key];
  if (!b || stars > b.stars || L.fruit > b.fruit) save.best[L.key] = { stars: Math.max(stars, b ? b.stars : 0), fruit: Math.max(L.fruit, b ? b.fruit : 0) };
  let extra = '';
  if (L.key === 'serengeti' && !save.candy) { save.candy = true; W.gates.candy.lock.visible = false; extra = '<br>🍭 Candyland is open! 🍭'; }
  persist();
  $('resTitle').textContent = L.key === 'candy' ? 'Sweet, Isla!' : 'Hooray, Isla!';
  $('resBody').innerHTML = `<span class="stars">${starStr(stars)}</span>${L.th.fruitEm} ${L.fruit} of ${L.total} ${L.th.fruitName}${extra}`;
  show('lvlUI', false); show('result', true);
}
function goMap() {
  sfx('click'); disposeLevel(); paused = false;
  ['lvlUI', 'pause', 'result', 'fail', 'title', 'select'].forEach(id => show(id, false));
  show('mapUI', true); mode = 'map'; startMusic('map');
  camera.far = 400; camera.updateProjectionMatrix();
  W.pos.y = heightAt(W.pos.x, W.pos.z);
  camera.position.set(W.pos.x, W.pos.y + 15, W.pos.z + 15);
  W.near = null; W.target = null; W.marker.visible = false;
  $('mapHint').style.opacity = 1; setTimeout(() => $('mapHint').style.opacity = 0, 7000);
}

/* =====================================================================
   SCREENS & INPUT
   ===================================================================== */
function buildCards() {
  const c = $('cards'); c.innerHTML = '';
  for (const k in ANIMALS) {
    const a = ANIMALS[k]; const d = document.createElement('div');
    d.className = 'card' + (k === save.animal ? ' on' : ''); d.dataset.k = k;
    d.innerHTML = `<div class="em">${a.em}</div><b>${a.name}</b><i>${a.desc}</i>`;
    d.addEventListener('click', () => pickAnimal(k));
    c.appendChild(d);
  }
}
function pickAnimal(k) {
  audioInit(); sfx('click'); save.animal = k; persist();
  document.querySelectorAll('.card').forEach(e => e.classList.toggle('on', e.dataset.k === k));
  const ry = W.rider ? W.rider.root.rotation.y : 0; setRider(k); W.rider.root.rotation.y = ry;
}
function goSelect() {
  audioInit(); sfx('click');
  ['title', 'mapUI'].forEach(id => show(id, false)); $('pop').classList.remove('on'); W.near = null;
  buildCards(); show('select', true); mode = 'select'; startMusic('map');
}
$('title').addEventListener('pointerdown', () => {
  audioInit();
  const el = document.documentElement;
  if (matchMedia('(pointer:coarse)').matches && el.requestFullscreen) el.requestFullscreen().catch(() => { });
  goSelect();
});
$('title').style.pointerEvents = 'auto';
$('goBtn').addEventListener('click', () => { W.face = 0; goMap(); });
$('rideBtn').addEventListener('click', goSelect);
$('muteBtn').addEventListener('click', () => { audioInit(); setMuted(!save.muted); });
$('popPlay').addEventListener('click', () => { if (W.near) startLevel(W.near); });
$('pauseBtn').addEventListener('click', () => setPaused(true));
$('resumeBtn').addEventListener('click', () => setPaused(false));
$('restartBtn').addEventListener('click', () => { paused = false; startLevel(LV.key); });
$('quitBtn').addEventListener('click', goMap);
$('resMap').addEventListener('click', goMap);
$('resAgain').addEventListener('click', () => startLevel(LV.key));
$('failMap').addEventListener('click', goMap);
$('failRetry').addEventListener('click', () => {
  sfx('click'); const L = LV; show('fail', false); show('lvlUI', true);
  resetRun(L, L.lastCp);
});
function setPaused(p) {
  if (mode !== 'level' || !LV) return;
  if (p && (LV.state === 'dead' || LV.state === 'finish')) return;
  paused = p; show('pause', p); sfx('click');
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (mode === 'level' && LV && LV.state === 'run') setPaused(true); if (AC) AC.suspend(); } else if (AC) AC.resume(); });

// pointer input on the 3D view
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let ptr = null;
function mapTarget(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(W.walk, false)[0];
  if (hit) { W.target = new THREE.Vector3(hit.point.x, 0, hit.point.z); W.marker.position.set(hit.point.x, hit.point.y + 0.08, hit.point.z); W.marker.visible = true; }
}
const cv = renderer.domElement;
cv.addEventListener('pointerdown', e => {
  audioInit();
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, used: false, t: performance.now() };
  if (mode === 'map') mapTarget(e);
});
cv.addEventListener('pointermove', e => {
  if (!ptr || ptr.id !== e.pointerId) return;
  if (mode === 'map') { mapTarget(e); return; }
  if (mode !== 'level' || paused || ptr.used) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y, th = Math.min(innerWidth, innerHeight) * 0.06;
  if (Math.abs(dx) > th && Math.abs(dx) > Math.abs(dy)) { steer(dx > 0 ? 1 : -1); ptr.used = true; }
  else if (dy < -th) { doJump(LV); ptr.used = true; }
});
function ptrEnd(e) {
  if (!ptr || ptr.id !== e.pointerId) return;
  if (mode === 'level' && !paused && !ptr.used && LV && LV.state !== 'dead') {
    const fx = e.clientX / innerWidth;
    if (fx < 0.3) steer(-1); else if (fx > 0.7) steer(1); else doJump(LV);
  }
  ptr = null;
}
cv.addEventListener('pointerup', ptrEnd);
cv.addEventListener('pointercancel', e => { ptr = null; });
addEventListener('keydown', e => {
  keys[e.code] = true; audioInit();
  if (mode === 'title') { goSelect(); return; }
  if (mode === 'select') {
    const ks = Object.keys(ANIMALS), i = ks.indexOf(save.animal);
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') pickAnimal(ks[(i + 2) % 3]);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') pickAnimal(ks[(i + 1) % 3]);
    if (e.code === 'Enter' || e.code === 'Space') { W.face = 0; goMap(); }
    return;
  }
  if (mode === 'map') {
    if ((e.code === 'Enter' || e.code === 'Space') && W.near && !(W.near === 'candy' && !save.candy)) startLevel(W.near);
    if (e.code === 'KeyM') setMuted(!save.muted);
    return;
  }
  if (mode === 'level') {
    if (e.code === 'Escape' || e.code === 'KeyP') { setPaused(!paused); return; }
    if (e.code === 'KeyM') setMuted(!save.muted);
    if (paused || e.repeat) return;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') steer(-1);
    if (e.code === 'ArrowRight' || e.code === 'KeyD') steer(1);
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (LV.state === 'run' || LV.state === 'count') doJump(LV); }
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

/* ---------------- main loop ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'level' && LV) { if (!paused) updateLevel(dt); renderer.render(LV.scene, camera); }
  else if (W.scene) { updateWorld(dt); renderer.render(W.scene, camera); }
}
function boot() {
  buildWorld();
  setMuted(save.muted);
  $('loading').remove();
  mode = 'title'; show('title', true);
  requestAnimationFrame(frame);
  window.__isla = { W, get LV() { return LV; }, startLevel, goMap, save, updateLevel, steer, doJump };
}
// wait (briefly) for the font so signs are drawn with it
Promise.race([document.fonts ? document.fonts.load('700 80px Fredoka') : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).catch(() => { }).then(boot);
</script>
